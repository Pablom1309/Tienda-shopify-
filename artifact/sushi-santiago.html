<title>Sushi Santiago</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap">
<style>
/* Mapa a pantalla completa; lista al costado en computador, hoja inferior en celular. */
:root {
  --mar: #0b2a3f;
  --mar-2: #154463;
  --sobre-mar: #ffffff;
  --sobre-mar-suave: #c3d5e2;
  --salmon: #f26b4e;
  --sobre-salmon: #ffffff;
  --fondo: #f1f4f6;
  --superficie: #ffffff;
  --tinta: #13212b;
  --suave: #566775;
  --linea: #d9e0e6;
  --elegido: #e9f1f6;
  --enlace: #1f5fd1;
  --peligro: #b3261e;
  --pendiente: #f26b4e;
  --visitado: #2f6fed;
  --cliente: #17935a;
  --descartado: #8c98a4;
  --sombra: rgba(6, 22, 34, .28);
  --titulos: "Space Grotesk", "Inter", system-ui, sans-serif;
  --texto: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --fondo: #0d1820; --superficie: #15242e; --tinta: #e7eef3; --suave: #9db0be; --linea: #2b3d4a;
    --elegido: #1d3443; --enlace: #7fb0ff; --peligro: #ff8a80; --sombra: rgba(0, 0, 0, .55);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --fondo: #0d1820; --superficie: #15242e; --tinta: #e7eef3; --suave: #9db0be; --linea: #2b3d4a;
  --elegido: #1d3443; --enlace: #7fb0ff; --peligro: #ff8a80; --sombra: rgba(0, 0, 0, .55);
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body { font: 16px/1.4 var(--texto); color: var(--tinta); background: var(--fondo); overflow: hidden; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--salmon); outline-offset: 2px; }

.app { height: 100%; display: flex; flex-direction: column; }
.barra {
  display: flex; align-items: center; gap: 12px; background: var(--mar); color: var(--sobre-mar);
  padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.titulo { display: grid; line-height: 1.15; min-width: 0; }
.marca { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--salmon); font-weight: 700; }
.titulo strong { font: 700 18px/1.15 var(--titulos); }
.avance { margin-left: auto; font-size: 13px; text-align: right; color: var(--sobre-mar-suave); font-variant-numeric: tabular-nums; }
.avance b { color: var(--sobre-mar); font-size: 15px; display: block; }
.btn-barra { background: none; border: 1px solid var(--mar-2); color: var(--sobre-mar); border-radius: 10px; min-height: 40px; padding: 6px 12px; font-size: 14px; font-weight: 600; }
.btn-barra:hover { background: var(--mar-2); }

.filtros {
  background: var(--superficie); border-bottom: 1px solid var(--linea); display: grid; gap: 8px;
  padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.busqueda { display: flex; gap: 8px; min-width: 0; }
.filtros input, .filtros select { border: 1px solid var(--linea); border-radius: 10px; padding: 10px 12px; background: var(--fondo); color: var(--tinta); min-width: 0; min-height: 44px; font: inherit; }
.filtros input { flex: 1; }
.filtros select { flex: 0 1 190px; }
.etiqueta { font-size: 12px; font-weight: 600; color: var(--tinta); background: var(--elegido); border: 1px solid var(--linea); border-radius: 999px; padding: 2px 10px; justify-self: start; }
.campo select { border: 1px solid var(--linea); border-radius: 10px; padding: 10px 11px; font: inherit; font-size: 16px; color: var(--tinta); background: var(--superficie); width: 100%; min-height: 44px; }
.chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: none; display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--linea); background: var(--superficie);
  border-radius: 999px; padding: 7px 12px; font-size: 14px; min-height: 36px; white-space: nowrap; font-variant-numeric: tabular-nums;
}
.chip[aria-pressed="true"] { background: var(--mar); border-color: var(--mar); color: var(--sobre-mar); }
.punto { width: 10px; height: 10px; border-radius: 50%; flex: none; display: inline-block; }
.punto.pendiente { background: var(--pendiente); }
.punto.visitado { background: var(--visitado); }
.punto.cliente { background: var(--cliente); }
.punto.descartado { background: var(--descartado); }

.cuerpo { flex: 1; min-height: 0; display: flex; position: relative; }
.mapa-caja { position: relative; flex: 1; min-width: 0; }
#mapa { position: absolute; inset: 0; z-index: 0; background: #dfe7ec; }
.panel { background: var(--superficie); overflow-y: auto; overscroll-behavior: contain; }

.boton { border: 1px solid var(--linea); background: var(--superficie); border-radius: 10px; padding: 11px 14px; font-weight: 600; min-height: 44px; }
.boton.primario { background: var(--salmon); border-color: var(--salmon); color: var(--sobre-salmon); }
.boton.oscuro { background: var(--mar); border-color: var(--mar); color: var(--sobre-mar); }
.boton.peligro { color: var(--peligro); }
.boton:disabled { opacity: .55; cursor: default; }

.flotante {
  position: absolute; right: max(12px, env(safe-area-inset-right, 0px)); bottom: 76px; z-index: 500; width: 52px; height: 52px; border-radius: 50%;
  border: 0; background: var(--superficie); font-size: 26px; line-height: 1; box-shadow: 0 3px 12px var(--sombra);
}
.flotante.activo { background: var(--salmon); color: var(--sobre-salmon); }
.ver-lista {
  position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 500; border-radius: 999px;
  background: var(--mar); color: var(--sobre-mar); border-color: var(--mar); box-shadow: 0 3px 12px var(--sombra); padding-inline: 22px;
}
.aviso-mapa {
  position: absolute; left: max(12px, env(safe-area-inset-left, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); top: 12px; z-index: 600;
  background: var(--mar); color: var(--sobre-mar); border-radius: 12px; padding: 12px 14px; display: flex; gap: 10px;
  align-items: center; justify-content: space-between; box-shadow: 0 3px 12px var(--sombra);
}
.aviso-mapa button { background: none; border: 1px solid var(--sobre-mar-suave); color: var(--sobre-mar); border-radius: 8px; padding: 8px 12px; flex: none; }

.lista-cabeza { display: none; }
.lista-vacia { padding: 28px 18px; color: var(--suave); text-align: center; }
.fila {
  display: flex; gap: 10px; align-items: flex-start; width: 100%; text-align: left; background: none; border: 0;
  border-bottom: 1px solid var(--linea); padding: 12px 16px;
}
.fila:hover { background: var(--fondo); }
.fila .punto { margin-top: 6px; }
.fila .txt { min-width: 0; display: grid; }
.fila small { color: var(--suave); }
.fila .nota { color: var(--tinta); font-style: italic; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.ficha { padding: 14px 16px 24px; }
.ficha-cabeza { display: flex; align-items: flex-start; gap: 10px; }
.ficha-cabeza h2 { margin: 0; font: 700 21px/1.2 var(--titulos); flex: 1; text-wrap: balance; min-width: 0; overflow-wrap: anywhere; }
.cerrar { background: var(--fondo); border: 0; border-radius: 50%; width: 40px; height: 40px; font-size: 18px; flex: none; }
.datos { margin: 8px 0 12px; color: var(--suave); font-size: 15px; display: grid; gap: 3px; }
.datos a { color: var(--enlace); overflow-wrap: anywhere; }
.datos .copiable { user-select: all; color: var(--tinta); }
.foto { display: grid; gap: 8px; margin-bottom: 14px; }
.foto img { width: 100%; max-height: 230px; object-fit: cover; border-radius: 12px; display: block; background: var(--fondo); }
.foto-botones { display: flex; gap: 8px; flex-wrap: wrap; }
.foto-botones .boton { flex: 1; font-size: 15px; text-align: center; cursor: pointer; }
.foto-botones input { position: absolute; width: 1px; height: 1px; opacity: 0; }
.foto-botones label:focus-within { outline: 3px solid var(--salmon); outline-offset: 2px; }
.foto small { color: var(--suave); }
.acciones { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
.acciones .boton { flex: 1; text-align: center; text-decoration: none; font-size: 15px; padding-inline: 10px; color: var(--tinta); }
.acciones .boton.oscuro { color: var(--sobre-mar); }
.estados { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; margin-bottom: 12px; }
.estado-btn {
  display: flex; align-items: center; gap: 8px; border: 1px solid var(--linea); border-radius: 10px; background: var(--superficie);
  padding: 10px 12px; min-height: 44px; font-weight: 600;
}
.estado-btn[aria-pressed="true"] { border-color: var(--salmon); box-shadow: inset 0 0 0 1px var(--salmon); background: var(--elegido); }
.campos { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.campo { display: grid; gap: 4px; font-size: 13px; color: var(--suave); align-content: start; }
.campo.ancho { grid-column: 1 / -1; }
.campo input, .campo textarea {
  border: 1px solid var(--linea); border-radius: 10px; padding: 10px 11px; font-size: 16px; color: var(--tinta);
  background: var(--superficie); width: 100%; min-width: 0;
}
.campo textarea { min-height: 110px; resize: vertical; }
.pie { display: flex; gap: 8px; align-items: center; margin-top: 14px; flex-wrap: wrap; }
.pie .boton.primario { flex: 1; }
.guardado { font-size: 12px; color: var(--suave); margin: 8px 0 0; }

.toast {
  position: fixed; left: 50%; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 3000;
  background: var(--mar); color: var(--sobre-mar); padding: 11px 16px; border-radius: 10px; max-width: calc(100vw - 32px);
  box-shadow: 0 6px 20px var(--sombra); font-size: 15px;
}
.toast.mal { background: var(--peligro); color: var(--superficie); }

@media (min-width: 860px) {
  .filtros { grid-template-columns: 460px 1fr; align-items: center; }
  .panel { width: 380px; flex: none; border-right: 1px solid var(--linea); }
  .ver-lista { display: none; }
  .flotante { bottom: 24px; }
  .toast { bottom: 28px; }
}
@media (max-width: 859px) {
  .panel {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 900; max-height: 100%;
    border-radius: 16px 16px 0 0; box-shadow: 0 -6px 24px var(--sombra); transform: translateY(105%); transition: transform .22s ease;
  }
  .panel.abierto { transform: none; }
  .panel.modo-lista { top: 0; border-radius: 0; }
  .panel.modo-ficha { max-height: 78%; }
  .lista-cabeza {
    position: sticky; top: 0; background: var(--superficie); display: flex; justify-content: space-between; align-items: center;
    padding: 10px 16px; border-bottom: 1px solid var(--linea); font-weight: 700; z-index: 1;
  }
}
@media (prefers-reduced-motion: reduce) { .panel { transition: none; } }

  }

  const normalizar = (s) => (s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
  const limpio = (v, max) => String(v ?? '').trim().slice(0, max);

  function dentroDeComuna(lat, lon) {
    const anillo = COMUNA.coordinates[0];
    let dentro = false;
    for (let i = 0, j = anillo.length - 1; i < anillo.length; j = i++) {
      const [xi, yi] = anillo[i];
      const [xj, yj] = anillo[j];
      if ((yi > lat) !== (yj > lat) && lon < ((xj - xi) * (lat - yi)) / (yj - yi) + xi) dentro = !dentro;
    }
    return dentro;
  }

  function mensajeError(e) {
    if (e && e.code === 'quota_exceeded') return 'Se llenó el espacio de datos. Elimina locales que no uses.';
    if (e && (e.code === 'invalid_argument' || e.code === 'revoked' || e.code === 'not_granted')) return 'No tienes permiso para guardar en esta página.';
    return 'No se pudo guardar. Revisa tu conexión e intenta de nuevo.';
  }

  // ---------- mapa ----------
  function crearMapa() {
    const borde = L.geoJSON(COMUNA, { style: { color: '#0b2a3f', weight: 2, fillOpacity: 0.03, dashArray: '6 6' }, interactive: false });
    const limites = borde.getBounds();
    mapa = L.map('mapa', { zoomControl: false, minZoom: 13, maxZoom: 18, maxBounds: limites.pad(0.25), maxBoundsViscosity: 0.8 });
    L.control.zoom({ position: 'topright' }).addTo(mapa);
    L.tileLayer('tiles/{z}-{x}-{y}.png', {
      minZoom: 13, maxZoom: 18, maxNativeZoom: 16, bounds: limites.pad(0.02),
      attribution: '© OpenStreetMap',
    }).addTo(mapa);
    borde.addTo(mapa);
    capa = L.layerGroup().addTo(mapa);
    mapa.fitBounds(limites, { padding: [10, 10] });
    mapa.on('click', (ev) => { if (estado.agregando) formularioNuevo(ev.latlng); });
  }

  function estiloMarcador(l) {
    const elegido = l.id === estado.seleccionado;
    return {
      radius: elegido ? 12 : 8,
      color: elegido ? '#0b2a3f' : '#fff',
      weight: elegido ? 3 : 2,
      fillColor: COLOR[l.estado] || COLOR.pendiente,
      fillOpacity: l.estado === 'descartado' ? 0.6 : 1,
    };
  }

  function visibles() {
    const q = normalizar(estado.busqueda);
    return estado.locales.filter((l) => {
      if (estado.filtro !== 'todos' && l.estado !== estado.filtro) return false;
      if (estado.rubro !== 'todos' && l.rubro !== estado.rubro) return false;
      if (!q) return true;
      return normalizar(`${l.nombre} ${l.direccion || ''} ${l.notas || ''} ${l.contacto || ''}`).includes(q);
    });
  }

  function pintarMarcadores(lista) {
    capa.clearLayers();
    marcadores.clear();
    for (const l of lista) {
      const m = L.circleMarker([l.lat, l.lon], estiloMarcador(l));
      m.bindTooltip(l.nombre, { direction: 'top', offset: [0, -8] });
      m.on('click', (ev) => {
        L.DomEvent.stopPropagation(ev);
        if (estado.agregando) formularioNuevo(ev.latlng); else abrirFicha(l.id);
      });
      m.addTo(capa);
      marcadores.set(l.id, m);
    }
    const elegido = marcadores.get(estado.seleccionado);
    if (elegido) elegido.bringToFront();
  }

  // ---------- cabecera, filtros y lista ----------
  function pintarAvance() {
    if (estado.cargando) return $('avance').replaceChildren();
    const delRubro = estado.locales.filter((l) => estado.rubro === 'todos' || l.rubro === estado.rubro);
    const total = delRubro.length;
    const hechos = delRubro.filter((l) => l.estado !== 'pendiente').length;
    $('avance').replaceChildren(h('b', null, `${hechos} de ${total}`), 'visitados');
  }

  function pintarChips() {
    const delRubro = estado.locales.filter((l) => estado.rubro === 'todos' || l.rubro === estado.rubro);
    const cuenta = (id) => delRubro.filter((l) => l.estado === id).length;
    const chip = (id, texto, n, punto) => h('button', {
      class: 'chip', type: 'button', 'aria-pressed': String(estado.filtro === id),
      onclick: () => { estado.filtro = id; pintarTodo(); },
    }, punto && h('span', { class: `punto ${id}` }), `${texto} ${n}`);
    $('chips').replaceChildren(
      chip('todos', 'Todos', delRubro.length),
      ...ESTADOS.map((e) => chip(e.id, e.plural, cuenta(e.id), true))
    );
  }

  function pintarLista(lista) {
    const cabeza = h('div', { class: 'lista-cabeza' },
      `${lista.length} locales`,
      h('button', { class: 'cerrar', type: 'button', 'aria-label': 'Cerrar lista', onclick: cerrarPanel }, '✕'));
    const filas = lista.map((l) => h('button', { class: 'fila', type: 'button', onclick: () => abrirFicha(l.id, true) },
      h('span', { class: `punto ${l.estado}` }),
      h('span', { class: 'txt' },
        h('strong', null, l.nombre),
        h('small', null, `${NOMBRE_RUBRO[l.rubro]} · ${l.direccion || 'sin dirección'}`),
        l.notas && h('small', { class: 'nota' }, l.notas))));
    let vacio = '';
    if (!lista.length) {
      vacio = estado.problema ? estado.problema
        : estado.cargando ? 'Cargando los locales…'
        : estado.locales.length ? 'Ningún local coincide con la búsqueda o el filtro.'
        : 'Todavía no hay locales. Agrega el primero con el botón ＋ del mapa.';
    }
    $('lista').replaceChildren(cabeza, ...filas, vacio ? h('p', { class: 'lista-vacia' }, vacio) : '');
  }

  function pintarRubros() {
    const opcion = (id, texto, n) => h('option', { value: id, selected: estado.rubro === id }, `${texto} (${n})`);
    $('rubro').replaceChildren(
      opcion('todos', 'Todos los rubros', estado.locales.length),
      ...RUBROS.map(([id, nombre]) => [id, nombre, estado.locales.filter((l) => l.rubro === id).length])
        .filter(([id, , n]) => n || id === estado.rubro).map(([id, nombre, n]) => opcion(id, nombre, n)));
  }

  function pintarTodo() {
    const lista = visibles();
    pintarRubros();
    pintarAvance();
    pintarChips();
    pintarLista(lista);
    pintarMarcadores(lista);
  }

  // ---------- panel (lista / ficha) ----------
  function mostrarPanel(modo) {
    const p = $('panel');
    $('lista').hidden = modo !== 'lista';
    $('ficha').hidden = modo !== 'ficha';
    p.classList.toggle('modo-lista', modo === 'lista');
    p.classList.toggle('modo-ficha', modo === 'ficha');
    p.classList.add('abierto');
    p.scrollTop = 0;
  }
  const cerrarPanel = () => $('panel').classList.remove('abierto');
  const volverALista = () => { if (esCelular()) cerrarPanel(); else mostrarPanel('lista'); };

  function puedeSalir() {
    if (!estado.sinGuardar) return true;
    avisar('Tienes cambios sin guardar: pulsa Guardar o Descartar.', true);
    return false;
  }

  function soltarSeleccion() {
    const anterior = estado.seleccionado;
    estado.seleccionado = null;
    estado.sinGuardar = false;
    quitarMarcadorNuevo();
    const loc = estado.locales.find((l) => l.id === anterior);
    if (loc && marcadores.has(anterior)) marcadores.get(anterior).setStyle(estiloMarcador(loc));
  }

  function cerrarFicha() {
    if (!puedeSalir()) return;
    soltarSeleccion();
    volverALista();
  }

  function enlaceWeb(web) {
    if (!web) return null;
    const url = /^https?:\/\//i.test(web) ? web : /^[\w-]+(\.[\w-]+)+/.test(web) ? `https://${web}` : null;
    return url ? h('a', { href: url, target: '_blank', rel: 'noopener noreferrer' }, web.replace(/^https?:\/\/(www\.)?/i, '')) : h('span', null, web);
  }

  function abrirFicha(id, centrar) {
    if (id !== estado.seleccionado && !puedeSalir()) return;
    const l = estado.locales.find((x) => x.id === id);
    if (!l) return;
    quitarMarcadorNuevo();
    const anterior = estado.seleccionado;
    estado.seleccionado = id;
    estado.sinGuardar = false;
    for (const i of [anterior, id]) {
      const loc = estado.locales.find((x) => x.id === i);
      if (loc && marcadores.has(i)) marcadores.get(i).setStyle(estiloMarcador(loc));
    }
    if (marcadores.has(id)) marcadores.get(id).bringToFront();

    const borrador = { estado: l.estado };
    const selRubro = h('select', { id: 'campo-rubro', onchange: () => marcar() }, RUBROS.map(([id, nombre]) => h('option', { value: id, selected: l.rubro === id }, nombre)));
    const btnDescartar = h('button', { class: 'boton', type: 'button', hidden: true, onclick: () => { estado.sinGuardar = false; abrirFicha(l.id); } }, 'Descartar');
    const marcar = () => { estado.sinGuardar = true; btnDescartar.hidden = false; };

    const entradas = {};
    const botonesEstado = h('div', { class: 'estados', role: 'group', 'aria-label': 'Estado del local' });
    const pintarEstados = () => botonesEstado.replaceChildren(...ESTADOS.map((e) => h('button', {
      class: 'estado-btn', type: 'button', 'aria-pressed': String(borrador.estado === e.id),
      onclick: () => {
        borrador.estado = e.id;
        if (e.id !== 'pendiente' && !entradas.fecha_visita.value) entradas.fecha_visita.value = hoy();
        marcar();
        pintarEstados();
      },
    }, h('span', { class: `punto ${e.id}` }), e.nombre)));

    const campos = h('div', { class: 'campos' }, CAMPOS.map((c) => {
      const entrada = c.tipo === 'area'
        ? h('textarea', { id: `campo-${c.id}`, placeholder: 'Con quién hablé, qué le interesa, cuándo volver…', maxLength: 5000 })
        : h('input', { id: `campo-${c.id}`, type: c.tipo || 'text', maxLength: 300, inputMode: c.id === 'consumo' ? 'decimal' : null });
      entrada.value = l[c.id] || '';
      entrada.addEventListener('input', marcar);
      entradas[c.id] = entrada;
      return h('label', { class: `campo${c.ancho ? ' ancho' : ''}` }, c.etiqueta, entrada);
    }));
    pintarEstados();

    const btnGuardar = h('button', { class: 'boton primario', type: 'submit' }, 'Guardar');
    let confirmando = false;
    const btnEliminar = l.origen === 'manual' && h('button', {
      class: 'boton peligro', type: 'button',
      onclick: async () => {
        if (!confirmando) {
          confirmando = true;
          btnEliminar.textContent = 'Confirmar: eliminar';
          setTimeout(() => { confirmando = false; btnEliminar.textContent = 'Eliminar'; }, 4000);
          return;
        }
        btnEliminar.disabled = true;
        try {
          await estado.db.collection('locales').doc(l.id).delete();
          soltarSeleccion();
          volverALista();
          avisar('Local eliminado');
        } catch (e) {
          btnEliminar.disabled = false;
          avisar(mensajeError(e), true);
        }
      },
    }, 'Eliminar');

    const formulario = h('form', {
      onsubmit: async (ev) => {
        ev.preventDefault();
        const cambios = { estado: borrador.estado, rubro: selRubro.value, actualizado: new Date().toISOString() };
        for (const c of CAMPOS) cambios[c.id] = limpio(entradas[c.id].value, c.id === 'notas' ? 5000 : 300);
        btnGuardar.disabled = true;
        btnGuardar.textContent = 'Guardando…';
        try {
          await estado.db.collection('locales').doc(l.id).update(cambios);
          Object.assign(l, cambios);
          estado.sinGuardar = false;
          avisar('Guardado');
          pintarTodo();
          abrirFicha(l.id);
        } catch (e) {
          btnGuardar.disabled = false;
          btnGuardar.textContent = 'Guardar';
          avisar(mensajeError(e), true);
        }
      },
    },
    botonesEstado, campos,
    h('div', { class: 'campos', style: 'margin-top:10px' }, h('label', { class: 'campo ancho' }, 'Rubro', selRubro)),
    h('div', { class: 'pie' }, btnGuardar, btnDescartar, btnEliminar),
    l.actualizado && h('p', { class: 'guardado' }, `Última modificación: ${new Date(l.actualizado).toLocaleString('es-CL', { dateStyle: 'medium', timeStyle: 'short' })}`));

    const busqueda = encodeURIComponent(`${l.nombre} ${l.direccion || ''} Santiago Chile`);
    $('ficha').replaceChildren(
      h('div', { class: 'ficha-cabeza' },
        h('h2', null, l.nombre),
        h('button', { class: 'cerrar', type: 'button', 'aria-label': 'Cerrar ficha', onclick: cerrarFicha }, '✕')),
      h('div', { class: 'datos' },
        h('span', { class: 'etiqueta' }, NOMBRE_RUBRO[l.rubro]),
        h('span', null, l.direccion || 'Sin dirección registrada'),
        l.telefono && h('span', { class: 'copiable' }, l.telefono),
        enlaceWeb(l.web),
        l.horario && h('span', null, `Horario: ${l.horario}`),
        l.origen === 'manual' && h('span', null, 'Agregado a mano')),
      bloqueFoto(l),
      h('div', { class: 'acciones' },
        h('a', { class: 'boton oscuro', href: `https://www.google.com/maps/dir/?api=1&destination=${l.lat},${l.lon}`, target: '_blank', rel: 'noopener noreferrer' }, 'Cómo llegar'),
        h('a', { class: 'boton', href: `https://www.google.com/maps/search/?api=1&query=${busqueda}`, target: '_blank', rel: 'noopener noreferrer' }, 'Ver en Google Maps')),
      formulario);
    mostrarPanel('ficha');
    if (centrar) mapa.setView([l.lat, l.lon], Math.max(mapa.getZoom(), 16), { animate: false });
    if (esCelular()) {
      const punto = mapa.latLngToContainerPoint([l.lat, l.lon]);
      const tam = mapa.getSize();
      mapa.panBy([punto.x - tam.x / 2, punto.y - tam.y * 0.12], { animate: true });
    }
  }

  // ---------- foto de referencia ----------
  const urlFoto = {};
  const fuenteFoto = (id) => urlFoto[id] || `/_blob/${id}`;

  // Reduce la foto a un tamaño razonable antes de subirla.
  async function reducirFoto(archivo) {
    const imagen = await new Promise((ok, mal) => {
      const img = new Image();
      const url = URL.createObjectURL(archivo);
      img.onload = () => { URL.revokeObjectURL(url); ok(img); };
      img.onerror = () => { URL.revokeObjectURL(url); mal(new Error('imagen')); };
      img.src = url;
    });
    const escala = Math.min(1, 1280 / Math.max(imagen.naturalWidth, imagen.naturalHeight));
    const lienzo = document.createElement('canvas');
    lienzo.width = Math.max(1, Math.round(imagen.naturalWidth * escala));
    lienzo.height = Math.max(1, Math.round(imagen.naturalHeight * escala));
    lienzo.getContext('2d').drawImage(imagen, 0, 0, lienzo.width, lienzo.height);
    return new Promise((ok, mal) => lienzo.toBlob((b) => (b ? ok(b) : mal(new Error('imagen'))), 'image/jpeg', 0.82));
  }

  function bloqueFoto(l) {
    const caja = h('div', { class: 'foto' });
    const pintar = (ocupado) => {
      const entrada = h('input', { id: 'foto-archivo', type: 'file', accept: 'image/*', disabled: !!ocupado });
      entrada.addEventListener('change', async () => {
        const archivo = entrada.files && entrada.files[0];
        if (!archivo) return;
        pintar('Subiendo la foto…');
        const anterior = l.foto;
        try {
          const reducida = await reducirFoto(archivo);
          const subida = await estado.assets.upload(reducida, { type: 'image/jpeg' });
          urlFoto[subida.id] = subida.url;
          await estado.db.collection('locales').doc(l.id).update({ foto: subida.id, actualizado: new Date().toISOString() });
          l.foto = subida.id;
          if (anterior) estado.assets.delete(anterior).catch(() => {});
          avisar('Foto guardada');
        } catch (e) {
          const grande = e && e.code === 'too_large';
          const lleno = e && e.code === 'quota_or_state';
          avisar(grande ? 'La foto es demasiado grande.' : lleno ? 'No queda espacio para más fotos.' : e && e.message === 'imagen' ? 'Ese archivo no es una imagen que se pueda leer.' : 'No se pudo guardar la foto. Intenta de nuevo.', true);
        }
        pintar();
      });
      const quitar = l.foto && estado.assets && h('button', {
        class: 'boton peligro', type: 'button', disabled: !!ocupado,
        onclick: async () => {
          const id = l.foto;
          pintar('Quitando la foto…');
          try {
            await estado.db.collection('locales').doc(l.id).update({ foto: '', actualizado: new Date().toISOString() });
            l.foto = '';
            estado.assets.delete(id).catch(() => {});
          } catch (e) {
            avisar(mensajeError(e), true);
          }
          pintar();
        },
      }, 'Quitar foto');
      const img = l.foto && h('img', { src: fuenteFoto(l.foto), alt: `Foto de referencia de ${l.nombre}`, loading: 'lazy' });
      if (img) img.addEventListener('error', () => img.replaceWith(h('small', null, 'No se pudo cargar la foto.')));
      caja.replaceChildren(
        img || '',
        ocupado ? h('small', null, ocupado) : '',
        estado.assets ? h('div', { class: 'foto-botones' },
          h('label', { class: 'boton' }, l.foto ? 'Cambiar foto' : 'Agregar foto', entrada), quitar) : '');
    };
    pintar();
    return caja;
  }

  // ---------- agregar local ----------
  function quitarMarcadorNuevo() {
    if (marcadorNuevo) { marcadorNuevo.remove(); marcadorNuevo = null; }
  }

  function modoAgregar(activo) {
    if (activo && !estado.db) return avisar('Todavía no se puede guardar en esta página.', true);
    estado.agregando = activo;
    $('btn-agregar').classList.toggle('activo', activo);
    $('mapa').style.cursor = activo ? 'crosshair' : '';
    const aviso = $('aviso-mapa');
    aviso.hidden = !activo;
    if (activo) {
      aviso.replaceChildren(
        h('span', null, 'Toca el mapa en el lugar donde está el local.'),
        h('button', { type: 'button', onclick: () => modoAgregar(false) }, 'Cancelar'));
      if (esCelular()) cerrarPanel();
    }
  }

  function formularioNuevo(punto) {
    if (!puedeSalir()) return;
    if (!dentroDeComuna(punto.lat, punto.lng)) return avisar('Ese punto está fuera de la comuna de Santiago.', true);
    modoAgregar(false);
    soltarSeleccion();
    marcadorNuevo = L.circleMarker(punto, { radius: 12, color: '#0b2a3f', weight: 3, fillColor: '#fff', fillOpacity: 1 }).addTo(mapa);

    const nombre = h('input', { id: 'nuevo-nombre', type: 'text', required: true, maxLength: 200 });
    const direccion = h('input', { id: 'nuevo-direccion', type: 'text', maxLength: 300 });
    const telefono = h('input', { id: 'nuevo-telefono', type: 'tel', maxLength: 100 });
    const rubro = h('select', { id: 'nuevo-rubro' }, RUBROS.map(([id, n]) => h('option', { value: id, selected: id === (estado.rubro === 'todos' ? 'sushi' : estado.rubro) }, n)));
    const btn = h('button', { class: 'boton primario', type: 'submit' }, 'Agregar local');
    const cancelar = () => { quitarMarcadorNuevo(); volverALista(); };

    $('ficha').replaceChildren(
      h('div', { class: 'ficha-cabeza' },
        h('h2', null, 'Nuevo local'),
        h('button', { class: 'cerrar', type: 'button', 'aria-label': 'Cancelar', onclick: cancelar }, '✕')),
      h('form', {
        onsubmit: async (ev) => {
          ev.preventDefault();
          if (!limpio(nombre.value, 200)) return;
          btn.disabled = true;
          const local = {
            origen: 'manual', rubro: rubro.value, nombre: limpio(nombre.value, 200), direccion: limpio(direccion.value, 300),
            telefono: limpio(telefono.value, 100), web: '', horario: '', lat: punto.lat, lon: punto.lng,
            estado: 'pendiente', fecha_visita: '', contacto: '', contacto_telefono: '', proveedor: '', consumo: '',
            precio: '', notas: '', actualizado: new Date().toISOString(),
          };
          try {
            const ref = estado.db.collection('locales').doc();
            await ref.set(local);
            quitarMarcadorNuevo();
            if (!estado.locales.some((x) => x.id === ref.id)) estado.locales.push({ id: ref.id, ...local });
            ordenar();
            estado.filtro = 'todos';
            if (estado.rubro !== local.rubro) estado.rubro = 'todos';
            pintarTodo();
            abrirFicha(ref.id);
            avisar('Local agregado');
          } catch (e) {
            btn.disabled = false;
            avisar(mensajeError(e), true);
          }
        },
      },
      h('div', { class: 'campos' },
        h('label', { class: 'campo ancho' }, 'Nombre del local', nombre),
        h('label', { class: 'campo ancho' }, 'Rubro', rubro),
        h('label', { class: 'campo ancho' }, 'Dirección', direccion),
        h('label', { class: 'campo ancho' }, 'Teléfono', telefono)),
      h('div', { class: 'pie' }, btn)));
    mostrarPanel('ficha');
    nombre.focus();
  }

  // ---------- datos ----------
  const ordenar = () => estado.locales.sort((a, b) => String(a.nombre).localeCompare(String(b.nombre), 'es'));

  function recibir(snap) {
    estado.locales = snap.docs
      .map((d) => ({ id: d.id, ...d.data() }))
      .filter((l) => typeof l.lat === 'number' && typeof l.lon === 'number' && l.nombre)
      .map((l) => ({
        ...l, nombre: String(l.nombre), estado: COLOR[l.estado] ? l.estado : 'pendiente',
        // Los primeros locales cargados eran todos de sushi y no traían rubro.
        rubro: NOMBRE_RUBRO[l.rubro] ? l.rubro : l.origen === 'osm' ? 'sushi' : 'otro',
      }));
    ordenar();
    if (!snap.metadata.fromCache) { estado.cargando = false; estado.problema = ''; clearTimeout(espera); }
    pintarTodo();
    // Si la ficha abierta cambió en otro dispositivo y aquí no se está editando, refrescarla.
    if (estado.seleccionado && !estado.sinGuardar && !$('ficha').hidden) {
      if (!estado.locales.some((l) => l.id === estado.seleccionado)) { soltarSeleccion(); volverALista(); }
      else if (!$('ficha').contains(document.activeElement)) abrirFicha(estado.seleccionado);
    }
  }

  let espera;
  async function conectar() {
    espera = setTimeout(() => {
      estado.problema = estado.locales.length ? '' : 'No se pudo llegar a los datos todavía. Revisa tu conexión.';
      if (estado.locales.length) avisar('Sin conexión: puede que los datos no estén al día.', true);
      pintarTodo();
    }, 10000);
    const db = window.claude && window.claude.use ? await window.claude.use('db') : null;
    if (!db) {
      clearTimeout(espera);
      estado.cargando = false;
      estado.problema = 'Abre esta página con tu cuenta de Claude para ver y guardar los locales.';
      $('btn-agregar').hidden = true;
      return pintarTodo();
    }
    estado.db = db;
    db.collection('locales').limit(1000).onSnapshot(recibir, () => {
      clearTimeout(espera);
      estado.cargando = false;
      estado.problema = estado.locales.length ? '' : 'No se pudieron cargar los locales. Vuelve a abrir la página.';
      pintarTodo();
    });
    window.claude.use('assets').then((a) => {
      estado.assets = a;
      if (a && estado.seleccionado && !estado.sinGuardar && !$('ficha').hidden) abrirFicha(estado.seleccionado);
    });
    const descargas = await window.claude.use('downloads');
    if (descargas) {
      $('btn-exportar').hidden = false;
      $('btn-exportar').addEventListener('click', async () => {
        const columnas = ['nombre', 'rubro', 'direccion', 'telefono', 'web', 'horario', 'estado', 'fecha_visita', 'contacto',
          'contacto_telefono', 'proveedor', 'consumo', 'precio', 'notas', 'lat', 'lon'];
        const celda = (v) => `"${String(v ?? '').replace(/"/g, '""')}"`;
        const filas = [columnas.join(';'), ...estado.locales.map((l) => columnas.map((c) => celda(l[c])).join(';'))];
        try {
          await descargas.save({ filename: `clientes-santiago-${hoy()}.csv`, data: '﻿' + filas.join('\r\n') });
        } catch (e) {
          if (e && e.code !== 'declined') avisar('No se pudo exportar en este dispositivo.', true);
        }
      });
    }
  }

  // ---------- eventos y arranque ----------
  $('rubro').addEventListener('change', (ev) => { estado.rubro = ev.target.value; pintarTodo(); });
  $('buscar').addEventListener('input', (ev) => { estado.busqueda = ev.target.value; pintarTodo(); });
  $('btn-lista').addEventListener('click', () => mostrarPanel('lista'));
  $('btn-agregar').addEventListener('click', () => modoAgregar(!estado.agregando));
  window.addEventListener('resize', () => { if (!esCelular() && estado.seleccionado === null && !marcadorNuevo) mostrarPanel('lista'); });

  crearMapa();
  if (!esCelular()) mostrarPanel('lista');
  pintarTodo();
  conectar();
})();
</script>
